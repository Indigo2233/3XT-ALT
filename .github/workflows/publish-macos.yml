name: Publish verified macOS packages
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful macOS packages run on main'
        required: true
        type: string
      confirm_public_release:
        description: 'Publish the authorized models and Mac packages to v1.0.1-local'
        required: true
        default: false
        type: boolean
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: inputs.confirm_public_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Require successful trusted build
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build.json"
          jq -e '.name == "macOS packages" and .head_branch == "main" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch")' "$RUNNER_TEMP/build.json"
          sha="$(jq -r .head_sha "$RUNNER_TEMP/build.json")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Verify source remains on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          pattern: package-macos-*
          path: release
          merge-multiple: true
      - name: Build small installer and verify archives
        run: |
          python3 tools/package-macos-launcher.py
          cd release
          sha256sum -c SHA256SUMS-macos-arm64.txt
          sha256sum -c SHA256SUMS-macos-x86_64.txt
          sha256sum -c SHA256SUMS-setup-macos.txt
      - name: Upload only Mac assets
        run: |
          gh release upload v1.0.1-local --clobber \
            release/XTAlt-1.0.1-local-macos-arm64.tar.gz \
            release/XTAlt-1.0.1-local-macos-x86_64.tar.gz \
            release/XTAlt-1.0.1-setup-macos.zip \
            release/SHA256SUMS-macos-arm64.txt \
            release/SHA256SUMS-macos-x86_64.txt \
            release/SHA256SUMS-setup-macos.txt
